<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CONCN DataHub</title>

    <!-- 天地图 API（v4.0）不在此同步引入: 同步第三方脚本会阻塞首屏,
         且 http 地址在 HTTPS 部署下会被浏览器按混合内容拦截。
         改由 MapComponent 动态加载（https 优先、http 兜底、失败显示提示并可重试） -->

    <style>
      /* 全局样式重置，确保页面占满视口 */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        font-family: 'Helvetica Neue', Arial, sans-serif;
        background-color: #f5f7fa;
      }
      /* Vue 根容器占满全屏 */
      #app {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <!-- Vue 入口文件 -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
